services:
  - type: web
    name: vibeshield-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    autoDeploy: false
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: SCAN_ALLOW_PRIVATE_TARGETS
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: vibeshield-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: AI_PROVIDER_FAMILY
        value: openai_compat
      - key: AI_MODEL
        value: openai/gpt-4o-mini
      - key: AI_API_KEY
        sync: false

databases:
  - name: vibeshield-db
    databaseName: vibeshield
    user: vibeshield
    plan: free
